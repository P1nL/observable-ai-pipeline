[project]
name = "observable-ai-pipeline"
version = "0.1.0"
description = "PostgreSQL-backed, recoverable CPU MOCK task runner"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "psycopg[binary]==3.2.6",
  "psutil==7.0.0",
  "Pillow==13.0.0",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "integration: requires a dedicated PostgreSQL database and subprocesses",
  "a12: opt-in real PostgreSQL stop/start in a newly owned disposable container",
]
